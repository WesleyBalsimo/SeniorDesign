<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Component Selector</title>
    <link rel="stylesheet" href="static/index.css"/>
  </head>
  <body>
    <header>
      <div id="categories">
        <h2 id="home" class="category" onclick="showHome()">Home</h2>
      </div>
      <div id="update">
        <input id="updateInput" type="file" accept=".csv" onchange="updateCSV()" hidden/>
        <label for="updateInput">Update Inventory</label>
      </div>
    </header>
    <main id="items">
      <div class="category-Home">
        <h1>Component Selector Instructions</h1>
        <ul>
          <li>Select component category</li>
          <li>Select component variant</li>
          <li>Wait for the robot to move and highlight item</li>
        </ul>
      </div>
    </main>
  </body>
</html>
<script src="static/script.js"></script>
